<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Zodiaque & 28 Lettres — application fondée sur le référentiel Abjad Maghrébin, les 28 lettres arabes, le zodiaque et les cycles lunaires.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<title>Zodiaque & 28 Lettres</title>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <button class="mobile-menu" id="mobileMenu" aria-label="Ouvrir le menu">☰</button>
    <div>
      <div class="eyebrow">RÉFÉRENTIEL FINAL</div>
      <h1>Zodiaque & 28 Lettres</h1>
      <p>Abjad Maghrébin · 12 signes · 28 lettres · cycles lunaires</p>
    </div>
  </div>
  <div class="statusbar">
    <span class="status ok">● Référentiel chargé</span>
    <span class="status info">Astronomie : données techniques séparées</span>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <nav>
      <button class="nav active" data-view="home">⌂ <span>Accueil</span></button>
      <button class="nav" data-view="letters">ا <span>28 lettres</span></button>
      <button class="nav" data-view="abjad">∑ <span>Calcul Abjad</span></button>
      <button class="nav" data-view="elements">◈ <span>Éléments</span></button>
      <button class="nav" data-view="zodiac">♈ <span>12 signes</span></button>
      <button class="nav" data-view="planets">☉ <span>Planètes</span></button>
      <button class="nav" data-view="correspondences">↔ <span>Correspondances</span></button>
      <button class="nav" data-view="moon">☾ <span>Phases lunaires</span></button>
      <button class="nav" data-view="astronomy">✦ <span>Astronomie</span></button>
      <button class="nav" data-view="lunar-days">28 <span>Jours lunaires</span></button>
      <button class="nav" data-view="profile">◎ <span>Profil / Thème natal</span></button>
      <button class="nav" data-view="sources">▤ <span>Sources</span></button>
      <button class="nav" data-view="method">ⓘ <span>Méthode</span></button>
      <button class="nav" data-view="reference">✓ <span>État du référentiel</span></button>
    </nav>
  </aside>

  <main id="app" class="content" aria-live="polite"></main>
</div>

<footer class="footer">
  <span>Zodiaque & 28 Lettres · Application 1.5.0</span>
  <span>Les interprétations astrologiques sont traditionnelles/symboliques et non scientifiques.</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js" crossorigin="anonymous"></script>
<script type="module" src="app.js"></script>
<script src="profil.js"></script>
</body>
</html>
