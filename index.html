<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="Zodiaque & 28 Lettres — application autonome d'exploration du zodiaque, de l'Abjad Maghrébin, des 28 lettres arabes et des référentiels symboliques.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<title>Zodiaque & 28 Lettres</title>
</head>
<body>
<header class="topbar">
  <div>
    <h1>Zodiaque & 28 Lettres</h1>
    <p class="subtitle">Référentiel Abjad Maghrébin • exploration zodiacale • cycles lunaires</p>
  </div>
  <div class="badges"><span class="badge ok">Référentiel validé</span><span class="badge warn">Astronomie indicative</span></div>
</header>
<div class="layout">
<aside class="sidebar">
  <button class="nav active" data-view="home">Accueil</button>
  <button class="nav" data-view="zodiac">12 signes</button>
  <button class="nav" data-view="letters">28 lettres</button>
  <button class="nav" data-view="abjad">Calcul Abjad</button>
  <button class="nav" data-view="elements">Éléments</button>
  <button class="nav" data-view="correspondences">Correspondances</button>
  <button class="nav" data-view="moon">Soleil & Lune</button>
  <button class="nav" data-view="lunar-days">28 jours lunaires</button>
  <button class="nav" data-view="method">Méthode & limites</button>
  <button class="nav" data-view="reference">Référentiel</button>
</aside>
<main id="app" class="content" aria-live="polite"></main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
