name: Vendor Astronomy Engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-astronomy.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Astronomy Engine package
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts astronomy-engine@2.1.19

      - name: Copy browser runtime locally
        run: |
          set -euo pipefail
          mkdir -p vendor/astronomy
          cp node_modules/astronomy-engine/source/js/astronomy.browser.min.js vendor/astronomy/astronomy.browser.min.js
          test -s vendor/astronomy/astronomy.browser.min.js
          sha256sum vendor/astronomy/astronomy.browser.min.js | tee vendor/astronomy/SHA256SUMS

      - name: Record upstream provenance
        run: |
          cat > vendor/astronomy/README.md <<'EOF'
# Astronomy Engine — vendored runtime

Pinned version: **2.1.19**

Upstream project: https://github.com/cosinekitty/astronomy
Package: `astronomy-engine@2.1.19`
Source browser build: `source/js/astronomy.browser.min.js`

This copy is intentionally stored locally so the application can run without a runtime CDN dependency. The astronomy calculations remain separate from the application's traditional/symbolic astrology interpretation layer.
EOF

      - name: Commit vendored runtime
        run: |
          if git diff --quiet -- vendor/astronomy; then
            echo 'Astronomy Engine is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/astronomy
          git commit -m 'build: vendor Astronomy Engine 2.1.19 locally'
          git push
