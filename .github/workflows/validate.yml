name: Validate Zodiaque

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ASTRONOMY_ENGINE_VERSION: "2.1.19"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock

      - name: Ensure local Astronomy Engine runtime
        run: |
          set -euo pipefail
          mkdir -p vendor/astronomy
          cp "node_modules/astronomy-engine/source/js/astronomy.browser.min.js" vendor/astronomy/astronomy.browser.min.js
          test -s vendor/astronomy/astronomy.browser.min.js
          grep -Eq '\.Astronomy=[A-Za-z_$]' vendor/astronomy/astronomy.browser.min.js
          sha256sum vendor/astronomy/astronomy.browser.min.js | tee vendor/astronomy/SHA256SUMS
          cat > vendor/astronomy/README.md <<EOF
# Astronomy Engine — runtime local

Version épinglée : **astronomy-engine@${ASTRONOMY_ENGINE_VERSION}**

Projet amont : https://github.com/cosinekitty/astronomy
Fichier source officiel : `source/js/astronomy.browser.min.js`
Package npm : `astronomy-engine@${ASTRONOMY_ENGINE_VERSION}`

Cette copie est versionnée dans le dépôt afin que l'application fonctionne sans CDN d'exécution. Les calculs astronomiques restent séparés de la couche d'interprétation astrologique traditionnelle/symbolique.
EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/astronomy/astronomy.browser.min.js vendor/astronomy/SHA256SUMS vendor/astronomy/README.md
          if git diff --cached --quiet; then
            echo 'Astronomy Engine runtime already current.'
          else
            git commit -m 'build: vendor Astronomy Engine 2.1.19 locally'
            git push origin HEAD:main
          fi

      - name: Validate application
        run: npm run validate
