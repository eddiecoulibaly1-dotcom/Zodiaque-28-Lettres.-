name: Vendor Astronomy Engine Final

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Astronomy Engine package
        run: npm install --no-save --ignore-scripts astronomy-engine@2.1.19

      - name: Copy official browser runtime into repository
        run: |
          set -euo pipefail
          mkdir -p vendor/astronomy
          cp node_modules/astronomy-engine/source/js/astronomy.browser.min.js vendor/astronomy/astronomy.browser.min.js
          test -s vendor/astronomy/astronomy.browser.min.js
          sha256sum vendor/astronomy/astronomy.browser.min.js | tee vendor/astronomy/SHA256SUMS
          grep -Eq '\.Astronomy=[A-Za-z_$]' vendor/astronomy/astronomy.browser.min.js

      - name: Record provenance
        run: |
          cat > vendor/astronomy/README.md <<'EOF'
# Astronomy Engine — runtime local

Pinned package: astronomy-engine@2.1.19

Upstream: https://github.com/cosinekitty/astronomy
Source: source/js/astronomy.browser.min.js

The runtime is vendored locally so the application does not depend on a runtime CDN. Astronomy calculations are kept separate from the application's traditional and symbolic astrology interpretation layer.
EOF

      - name: Commit vendored runtime
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/astronomy
          if git diff --cached --quiet; then
            echo 'Astronomy Engine runtime already current.'
            exit 0
          fi
          git commit -m 'build: vendor Astronomy Engine 2.1.19 locally'
          git push origin HEAD:main
