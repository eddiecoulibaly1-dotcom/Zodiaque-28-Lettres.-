name: Vendor Astronomy Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ASTRONOMY_ENGINE_VERSION: "2.1.19"
  ASTRONOMY_ENGINE_URL: "https://raw.githubusercontent.com/cosinekitty/astronomy/v2.1.19/source/js/astronomy.browser.min.js"

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned official browser runtime
        run: |
          set -euo pipefail
          mkdir -p vendor/astronomy
          curl --fail --location --retry 5 --retry-delay 2 \
            "$ASTRONOMY_ENGINE_URL" \
            --output vendor/astronomy/astronomy.browser.min.js
          test -s vendor/astronomy/astronomy.browser.min.js
          sha256sum vendor/astronomy/astronomy.browser.min.js | tee vendor/astronomy/SHA256SUMS

      - name: Record upstream provenance
        run: |
          cat > vendor/astronomy/README.md <<EOF
# Astronomy Engine — runtime local

Version épinglée : **astronomy-engine@${ASTRONOMY_ENGINE_VERSION}**

Projet amont : https://github.com/cosinekitty/astronomy
Fichier source officiel : source/js/astronomy.browser.min.js
URL source : ${ASTRONOMY_ENGINE_URL}

Cette copie est versionnée dans le dépôt afin que la production ne dépende d'aucun CDN d'exécution. Les calculs astronomiques restent séparés de la couche d'interprétation astrologique traditionnelle/symbolique.
EOF

      - name: Verify runtime
        run: |
          set -euo pipefail
          test -s vendor/astronomy/astronomy.browser.min.js
          grep -q 'Astronomy' vendor/astronomy/astronomy.browser.min.js
          test -s vendor/astronomy/SHA256SUMS

      - name: Commit vendored runtime
        run: |
          set -euo pipefail
          if git diff --quiet -- vendor/astronomy; then
            echo 'Runtime Astronomy Engine déjà à jour.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/astronomy/astronomy.browser.min.js vendor/astronomy/SHA256SUMS vendor/astronomy/README.md
          git commit -m 'build: vendor Astronomy Engine 2.1.19 locally'
          git push origin HEAD:main
